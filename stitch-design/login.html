<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        body {
            background: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(53, 37, 205, 0.05), transparent 25%);
            background-color: theme('colors.background');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-background flex items-center justify-center p-margin-mobile md:p-gutter antialiased">
<!-- Transactional Screen: Navigation Shell Suppressed -->
<main class="w-full max-w-[440px] mx-auto">
<div class="glass-card shadow-[0px_10px_25px_-5px_rgba(0,0,0,0.1)] rounded-[24px] p-xl md:p-xxl flex flex-col items-center">
<!-- Logo -->
<div class="mb-lg flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-2xl flex items-center justify-center mb-md shadow-[0px_4px_12px_rgba(53,37,205,0.2)]">
<span class="material-symbols-outlined text-4xl" data-icon="hub">hub</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg font-bold text-primary tracking-tight">Nexa</h1>
</div>
<!-- Headers -->
<div class="text-center mb-xl w-full">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Accede a tu red social tecnológica</p>
</div>
<!-- Form -->
<form class="w-full space-y-md">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block" for="email">Correo electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-xl py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary-container/20 transition-all outline-none" id="email" placeholder="tu@correo.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm pt-sm">
<label class="font-label-md text-label-md text-on-surface block" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-xl py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary-container/20 transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-sm pb-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 border-2 border-outline rounded-md peer-checked:bg-primary peer-checked:border-primary transition-colors group-hover:border-primary"></div>
<span class="material-symbols-outlined absolute text-white text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed text-on-primary rounded-xl py-3 px-4 font-label-md text-label-md transition-all shadow-[0px_4px_12px_rgba(53,37,205,0.2)] hover:shadow-[0px_6px_16px_rgba(53,37,205,0.3)] active:scale-[0.98] flex items-center justify-center gap-2" type="button">
                    Iniciar sesión
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-lg">
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-outline">o</span>
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
</div>
<!-- Secondary Actions -->
<div class="w-full space-y-md">
<button class="w-full bg-surface hover:bg-surface-container-low border-[1.5px] border-[#E2E8F0] text-on-surface rounded-xl py-3 px-4 font-label-md text-label-md transition-all flex items-center justify-center gap-3" type="button">
<img alt="Google Logo" class="w-5 h-5 object-contain" data-alt="A small, perfectly isolated Google 'G' logo icon designed in a flat, modern style. It features the classic red, yellow, green, and blue colors on a transparent or pure white background, suitable for a highly polished, minimalist digital UI button context. High resolution, clean edges." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAohnYywHwhDPesDLMetsNarc4bznkBMsjSpe11T2gH-kPS6tLYivk7dPZ9FDakC9u55Vp62ZBpaEQEen7R0yApemtq_Od7p3KCsgEq0ZOFhe26VegUB7WSNZ5WG6LTiCsJ3zUABsqUJZhz-oRWVTvxzwycnNwH2WeVKtFvea4BCdEe37fauuNBoZBVBDgyMpVCaUz7JpZwsJcU2D4vymRQ2NLlRaytgCE_FSSz1F_sGmagqOs-bF0s"/>
                    Continuar con Google
                </button>
</div>
<!-- Footer -->
<p class="mt-xl font-body-sm text-body-sm text-on-surface-variant text-center">
                ¿No tienes una cuenta? 
                <a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed transition-colors underline decoration-2 underline-offset-4 decoration-primary/30 hover:decoration-primary" href="#">Crear una cuenta</a>
</p>
</div>
</main>
</body></html>
