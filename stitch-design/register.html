<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Signup - Nexa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#faf8ff",
                        "on-primary-fixed": "#0f0069",
                        "surface-tint": "#4d44e3",
                        "on-tertiary-container": "#dadcde",
                        "tertiary": "#46494b",
                        "on-primary-container": "#dad7ff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#faf8ff",
                        "primary-container": "#4f46e5",
                        "surface-dim": "#d2d9f4",
                        "inverse-surface": "#283044",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#dae2fd",
                        "surface-variant": "#dae2fd",
                        "on-secondary": "#ffffff",
                        "secondary": "#505f76",
                        "secondary-fixed": "#d3e4fe",
                        "primary": "#3525cd",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-container": "#eaedff",
                        "surface-container-high": "#e2e7ff",
                        "primary-fixed": "#e2dfff",
                        "on-background": "#131b2e",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-error-container": "#93000a",
                        "on-surface": "#131b2e",
                        "tertiary-fixed": "#e0e3e5",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed-variant": "#3323cc",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "inverse-primary": "#c3c0ff",
                        "tertiary-container": "#5e6163",
                        "on-secondary-fixed-variant": "#38485d",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#464555",
                        "surface": "#faf8ff",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "inverse-on-surface": "#eef0ff",
                        "on-secondary-container": "#54647a",
                        "on-primary": "#ffffff",
                        "secondary-container": "#d0e1fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "lg": "24px",
                        "xs": "4px",
                        "gutter": "24px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "md": "16px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-gutter">
<!-- Signup Container -->
<main class="w-full max-w-lg bg-surface-container-lowest rounded-[24px] shadow-[0px_10px_25px_-5px_rgba(0,0,0,0.1)] p-xl border border-outline-variant/50 relative overflow-hidden">
<!-- Subtle decorative background element -->
<div class="absolute top-0 right-0 -mt-16 -mr-16 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-sm">Nexa</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to connect.</p>
</div>
<!-- Form -->
<form class="space-y-md flex flex-col">
<!-- Nombre completo -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="fullName">Nombre completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="fullName" placeholder="Ej. Juan Pérez" type="text"/>
</div>
</div>
<!-- Nombre de usuario -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="username">Nombre de usuario</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">alternate_email</span>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="username" placeholder="@username" type="text"/>
</div>
</div>
<!-- Correo electrónico -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="email" placeholder="tu@email.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Contraseña -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirmar contraseña -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="confirmPassword">Confirmar contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Fecha de nacimiento -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="dob">Fecha de nacimiento</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="dob" type="date"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl mt-md hover:bg-primary/90 transition-colors shadow-[0px_4px_14px_rgba(53,37,205,0.25)] flex items-center justify-center gap-2 group" type="button">
                Crear cuenta
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                ¿Ya tienes una cuenta? 
                <a class="text-primary font-label-md hover:underline" href="#">Inicia sesión</a>
</p>
</div>
</main>
</body></html>
